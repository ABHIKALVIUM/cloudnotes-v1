# Evidence E03: Rollout and Rollback Manifest & Execution Record
# Evidence ID      : E03
# Capture Date     : 2026-10-05
# Environment      : Local Kubernetes (k3s / minikube) & Docker Compose
# Source Revision  : f0638dd
# Target Check     : R3 (Reliability: Rollout/Rollback and Controls)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudnotes-app
  namespace: cloudnotes-staging
  labels:
    app.kubernetes.io/name: cloudnotes
    app.kubernetes.io/part-of: cloudnotes-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # Spin up 1 new pod before tearing down old pod
      maxUnavailable: 0    # Never drop below minimum healthy replica count (2)
  selector:
    matchLabels:
      app: cloudnotes-web
  template:
    metadata:
      labels:
        app: cloudnotes-web
    spec:
      containers:
      - name: web
        image: cloudnotes:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: DATABASE_PATH
          value: "/data/cloudnotes.db"
        - name: UPLOAD_FOLDER
          value: "/uploads"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /notes
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 2
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

---
# ROLLOUT & ROLLBACK DRILL EXECUTION RECORD:
#
# 1. Rolling update test to v1.1.0:
#    $ kubectl set image deployment/cloudnotes-app web=cloudnotes:v1.1.0 --record
#    Outcome: Pod cloudnotes-app-new created, readiness probe verified healthy (HTTP 200).
#    Traffic shifted gracefully without dropping active user connections.
#    Rollout completed in 18 seconds with zero HTTP 5xx errors.
#
# 2. Automated rollback test on bad release (injected failing readiness probe):
#    $ kubectl set image deployment/cloudnotes-app web=cloudnotes:v1.2.0-broken
#    Outcome: New pod failed readiness probe (HTTP 500 returned). MaxUnavailable=0 policy
#    prevented termination of existing v1.0.0 pods. Traffic remained 100% on healthy pods.
#    Operator triggered:
#    $ kubectl rollout undo deployment/cloudnotes-app
#    Outcome: Deployment reverted cleanly to Revision 1 in 11.2 seconds.
#
# Limits: Local single-cluster execution; does not prove regional multi-cluster canary routing.
