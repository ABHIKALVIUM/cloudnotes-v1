# k8s/deployment.yaml — CloudNotes 3-replica Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudnotes
  labels:
    app: cloudnotes
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloudnotes
  template:
    metadata:
      labels:
        app: cloudnotes
    spec:
      containers:
      - name: cloudnotes
        image: abhich98/cloudnotes:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
